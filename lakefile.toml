name = "lean-malliavin"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Malliavin", "ClarkOconeChallenge", "ClarkOconeSolution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

[leanOptions]
weak.linter.mathlibStandardSet = true
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "Malliavin"

[[lean_lib]]
name = "ClarkOconeChallenge"

[[lean_lib]]
name = "ClarkOconeSolution"
