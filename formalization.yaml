# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "lean-malliavin"
  description: >-
    The Clark--Ocone representation theorem for Brownian functionals on an
    abstract Gaussian Banach space, formalized in Lean 4 against Mathlib.
    The proof library (52 files) builds from Cameron--Martin quasi-invariance
    through the Wiener chaos decomposition and Itô isometry to the full
    representation formula. ClarkOconeChallenge.lean (312 lines) states the
    result using only Mathlib definitions; ClarkOconeSolution.lean bridges
    via the extracted proof library.
  authors:
    - "Ezzeri Esa"
  responsible_maintainers:
    - "Ezzeri Esa"
  license: "Apache-2.0"

classification:
  arxiv: ["math.PR", "math.FA"]
  msc2020: ["60H07", "46E35"]

sources:
  - title: "The Malliavin Calculus and Related Topics"
    authors:
      - "David Nualart"
    type: "book"
    id: "10.1007/3-540-28329-3"
    location: "Chapter 1, §1.2"
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      integral_inner_mderiv adapts Lemma 1.2.1, equation (1.30).
      mderiv_closable adapts Proposition 1.2.1.
      Nualart works with an isonormal Gaussian process over a Hilbert
      space. The Lean development realizes the Gaussian structure through
      the first chaos of a Gaussian measure on a separable Banach space,
      restricts to p = 2, and uses bounded C¹ Fréchet functionals with
      uniformly bounded derivative instead of the smooth cylindrical class.
  - title: "The Malliavin Calculus and Related Topics"
    authors:
      - "David Nualart"
    type: "book"
    id: "10.1007/3-540-28329-3"
    location: "Chapter 1, §1.3"
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      generated_clark_ocone adapts the Clark--Ocone representation
      theorem (Theorem 1.3.6). The formalization works on the natural
      filtration of an abstract pre-Brownian process on a Gaussian
      Banach space.

status:
  scope: >-
    Three compared submissions across two comparator configs, zero
    definition holes. The Clark--Ocone capstone
    (PalomarClarkOcone.generated_clark_ocone) is compared via
    comparator-clark-ocone.json. The registered pair
    (PALOMAR-2026-08-29-000016, integral_inner_mderiv and
    mderiv_closable) is compared via comparator.json. No unresolved
    sorry outside the deliberate Challenge placeholders. No Malliavin
    calculus or Clark--Ocone material exists in Mathlib at v4.33.0.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "integral_inner_mderiv"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "mderiv_closable"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "PalomarClarkOcone.generated_clark_ocone"
      file: "ClarkOconeSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-clark-ocone.json"

automation:
  methods:
    - method: "agent"
      models: ["Claude Fable (Anthropic)", "GPT 5.6 Sol (OpenAI)"]
      framework: "Claude Code and Codex"
      tool_setup: >-
        Claude Code multi-agent formalization sessions produced the proof
        library. Codex reviewed and verified the publication boundary and
        Palomar Comparator configuration.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
  notes: >-
    Challenge statement authored with AI assistance. Proof library
    developed as a standalone Lean 4 formalization of the Malliavin
    derivative on abstract Gaussian Banach spaces.

fidelity:
  divergences: >-
    Nualart proves closability for every p ≥ 1 on smooth cylindrical random
    variables over an isonormal Gaussian process. This formalization proves
    the p = 2 criterion on a separable Banach space carrying a Gaussian
    measure, using bounded C¹ Fréchet functionals with uniformly bounded
    derivative and realizing the Cameron–Martin space as the first chaos.
    The Clark--Ocone theorem is stated on the natural (generated, non-augmented)
    filtration; textbooks state it under the usual conditions on an arbitrary
    filtration. IsPreBrownianReal defines Brownian motion at the law level
    (correct finite-dimensional distributions, no path continuity assumed).
    The Sobolev space D^{1,2} is realized as the closure of the bounded-C¹
    graph, not as an a priori defined Sobolev class.

review:
  status: "agent-reviewed"
  reviewers:
    - "Ezzeri Esa"
    - "Claude Code (Anthropic)"
    - "Codex (OpenAI)"
  notes: >-
    Clark--Ocone pair Comparator-verified locally on 2026-08-31 against
    upstream leanprover/comparator at 8d84e67 using Lean's default kernel
    (not NanoDa). Negative control confirmed (mutated conclusion correctly
    rejected). Axiom audit: propext, Classical.choice, Quot.sound only.
    The registered pair (integral_inner_mderiv, mderiv_closable) was
    previously verified on 2026-08-29. Palomar injects its own protected
    NanoDa configuration at submission time.

alignment:
  statements:
    - source: "Nualart, Lemma 1.2.1, equation (1.30)"
      lean: "integral_inner_mderiv"
      module: "Solution"
      status: "proved"
      note: >-
        Specialized to p = 2 on an abstract Gaussian Banach space with a
        bounded-C¹ core (IsSmoothBounded).
    - source: "Nualart, Proposition 1.2.1"
      lean: "mderiv_closable"
      module: "Solution"
      status: "proved"
      note: >-
        Specialized to p = 2 on an abstract Gaussian Banach space with a
        bounded-C¹ core (IsSmoothBounded).
    - source: "Nualart, Theorem 1.3.6 (Clark--Ocone)"
      lean: "PalomarClarkOcone.generated_clark_ocone"
      module: "ClarkOconeSolution"
      status: "proved"
      note: >-
        Martingale representation and Clark--Ocone identity on the
        natural filtration of a pre-Brownian process on a Gaussian
        Banach space. The theorem operates on the natural (generated)
        filtration, not an arbitrary one as in the textbook.

acknowledgements: "Mathlib contributors; leanprover/comparator maintainers"
