version: "v0.4"

project:
  name: "lean-malliavin"
  description: >-
    Gaussian integration by parts and closability of the Malliavin derivative
    on an abstract Gaussian Banach space. Two compared theorems, zero
    definition holes. Challenge.lean (217 lines) states both results using
    only Mathlib definitions; Solution.lean bridges via definitional equality
    to the extracted Malliavin proof library.
  authors:
    - "Ezzeri Esa"
  responsible_maintainers:
    - "Ezzeri Esa"
  license: "Apache-2.0"

classification:
  arxiv: ["math.PR", "math.FA"]
  msc2020: ["60H07", "46E35"]

sources:
  - title: "The Malliavin Calculus and Related Topics"
    authors:
      - "David Nualart"
    type: "book"
    id: "10.1007/3-540-28329-3"
    location: "Chapter 1, §1.2, Proposition 1.2.1"
    relationship: "adapts"
    note: >-
      The Lean results specialize Nualart's Proposition 1.2.1 to p = 2, an
      abstract Gaussian Banach space (rather than classical Wiener space), and
      a bounded-C¹ core (IsSmoothBounded) instead of the full smooth cylinder
      functional class. The integration by parts formula is from Theorem 1.3.1
      (specialized to first-order and p = 2).

related_formalizations:
  - id: "https://github.com/savarin/lean-clark-ocone"
    relationship: "builds-on"
    note: >-
      Three proof-library files (CameronMartin.lean, CameronMartinTheorem.lean,
      MalliavinDerivative.lean) extracted at commit
      41d3f1509bc8f5c58ff3f17a4d9121ef4c3bb8a4.

status:
  scope: >-
    Two compared theorems (integral_inner_mderiv, mderiv_closable), zero
    definition holes. Challenge.lean imports only Mathlib and constructs all
    statement-level mathematics explicitly. Solution.lean repeats the
    declaration block and proves both theorems via definitional equality with
    the extracted Malliavin library.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "integral_inner_mderiv"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "mderiv_closable"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Claude Code"
      tool_setup: "Claude Code CLI with multi-agent formalization sessions"
  notes: >-
    Challenge statement authored with AI assistance. Proof development
    traced from lean-clark-ocone, a 58-file Lean 4 library formalizing
    the Clark–Ocone formula. Three source files extracted for this
    submission.

fidelity:
  divergences: >-
    Nualart proves closability for every p ≥ 1 on smooth cylindrical random
    variables over an isonormal Gaussian process. This formalization proves
    the p = 2 criterion on a separable Banach space carrying a Gaussian
    measure, using bounded C¹ Fréchet functionals with uniformly bounded
    derivative and realizing the Cameron–Martin space as the first chaos.

review:
  status: "self-assessed"
  reviewers:
    - "Ezzeri Esa"
  notes: >-
    Two-theorem Comparator-verified locally against upstream
    leanprover/comparator at 8d84e67 using Lean's default kernel (not
    NanoDa). Negative control confirmed for both theorems (mutated
    conclusions correctly rejected). Axiom audit for both theorems: propext,
    Classical.choice, Quot.sound only. Palomar injects its own protected
    NanoDa configuration at submission time.
