# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "lean-malliavin"
  description: >-
    Malliavin calculus on abstract Gaussian Banach spaces, formalized in
    Lean 4 against Mathlib. The repository contains two Comparator
    configurations: one registered (core, via comparator.json, pinned at
    commit 29c57b3) and one pending (Clark--Ocone, via
    comparator-clark-ocone.json). The proof library (52 files) builds
    from Cameron--Martin quasi-invariance through the Wiener chaos
    decomposition and Itô isometry to the full representation formula.
  authors:
    - "Ezzeri Esa"
  responsible_maintainers:
    - "Ezzeri Esa"
  license: "Apache-2.0"

classification:
  arxiv: ["math.PR", "math.FA"]
  msc2020: ["60H07", "46E35"]

sources:
  - title: "The Malliavin Calculus and Related Topics"
    authors:
      - "David Nualart"
    type: "book"
    id: "10.1007/3-540-28329-3"
    location: "Chapter 1, §1.2"
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      integral_inner_mderiv adapts Lemma 1.2.1, equation (1.30).
      mderiv_closable adapts Proposition 1.2.1.
      Nualart works with an isonormal Gaussian process over a Hilbert
      space. The Lean development realizes the Gaussian structure through
      the first chaos of a Gaussian measure on a separable Banach space,
      restricts to p = 2, and uses bounded C¹ Fréchet functionals with
      uniformly bounded derivative instead of the smooth cylindrical class.
  - title: "The Malliavin Calculus and Related Topics"
    authors:
      - "David Nualart"
    type: "book"
    id: "10.1007/3-540-28329-3"
    location: "Chapter 1, §1.3, Clark--Ocone formula (§1.3.4)"
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      generated_clark_ocone adapts the Clark--Ocone representation
      formula. The formalization works on the natural filtration of an
      abstract pre-Brownian process on a Gaussian Banach space.

status:
  scope: >-
    Three compared submissions across two comparator configs, zero
    definition holes. The Clark--Ocone capstone
    (PalomarClarkOcone.generated_clark_ocone) is compared via
    comparator-clark-ocone.json. The registered pair
    (PALOMAR-2026-08-29-000016, integral_inner_mderiv and
    mderiv_closable) is compared via comparator.json. No unresolved
    sorry outside the deliberate Challenge placeholders. No Malliavin
    calculus or Clark--Ocone material exists in Mathlib at v4.33.0.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "integral_inner_mderiv"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "mderiv_closable"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "PalomarClarkOcone.generated_clark_ocone"
      file: "ClarkOconeSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-clark-ocone.json"

automation:
  methods:
    - method: "agent"
      models: ["Claude Fable (Anthropic)", "GPT 5.6 Sol (OpenAI)"]
      framework: "Claude Code and Codex"
      tool_setup: >-
        Claude Code multi-agent formalization sessions produced the proof
        library. Codex reviewed and verified the publication boundary and
        Palomar Comparator configuration.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
  notes: >-
    Challenge statement authored with AI assistance. Proof library
    developed as a standalone Lean 4 formalization of the Malliavin
    derivative on abstract Gaussian Banach spaces.

fidelity:
  divergences: >-
    Core (closability): Nualart proves closability for every p ≥ 1 on
    smooth cylindrical random variables over an isonormal Gaussian process.
    This formalization proves the p = 2 criterion on a separable Banach
    space carrying a Gaussian measure, using bounded C¹ Fréchet functionals
    with uniformly bounded derivative and realizing the Cameron--Martin
    space as the first chaos.

    Clark--Ocone: the formalization works on an abstract separable Gaussian
    Banach space with an IsPreBrownianReal coordinate process (correct
    finite-dimensional distributions, no path continuity assumed), rather
    than starting from a path-space Brownian motion. Coordinates are given
    by continuous linear functionals generating the ambient measurable
    space, with a totality condition for the Brownian directions in
    Cameron--Martin space. The theorem operates on the natural (generated,
    non-augmented) filtration on nonneg time; textbooks state it under the
    usual conditions on an arbitrary filtration. The Sobolev space D^{1,2}
    is realized as the closure of a bounded-C¹ graph, not as an a priori
    defined Sobolev class. The Itô integral is characterized existentially
    by isometry, zero mean, elementary adapted increments, and martingale
    representation. The formula holds in L², with time-section conditional
    expectations for almost every positive time. No separate statement
    about path continuity, completed/right-continuous augmented filtration,
    or higher/lower Lᵖ variants is made.

review:
  status: "agent-reviewed"
  reviewers:
    - "Ezzeri Esa"
    - "Claude Code (Anthropic)"
    - "Codex (OpenAI)"
  notes: >-
    Core entry (PALOMAR-2026-08-29-000016): integral_inner_mderiv and
    mderiv_closable verified by Palomar's protected dual-kernel run at
    commit 29c57b3 via comparator.json. That immutable registered result
    is unaffected by later commits.

    Clark--Ocone entry: generated_clark_ocone Comparator-verified locally
    on 2026-08-31 via comparator-clark-ocone.json using Lean's default
    kernel and the development fake-Landrun wrapper (not Palomar's
    protected environment). Negative control confirmed (mutated conclusion
    correctly rejected). Axiom audit: propext, Classical.choice,
    Quot.sound only. A protected NanoDa run remains pending.

    Human review (Ezzeri Esa): verified the Challenge theorem statement
    against the source (Nualart, §1.3) and the author's dissertation.
    Lean proof code produced by AI agents under the author's direction.

alignment:
  statements:
    - source: "Nualart, Lemma 1.2.1, equation (1.30)"
      lean: "integral_inner_mderiv"
      module: "Solution"
      status: "proved"
      note: >-
        Specialized to p = 2 on an abstract Gaussian Banach space with a
        bounded-C¹ core (IsSmoothBounded).
    - source: "Nualart, Proposition 1.2.1"
      lean: "mderiv_closable"
      module: "Solution"
      status: "proved"
      note: >-
        Specialized to p = 2 on an abstract Gaussian Banach space with a
        bounded-C¹ core (IsSmoothBounded).
    - source: "Nualart, §1.3, Clark--Ocone formula (§1.3.4)"
      lean: "PalomarClarkOcone.generated_clark_ocone"
      module: "ClarkOconeSolution"
      status: "proved"
      note: >-
        Martingale representation and Clark--Ocone identity on the
        natural filtration of a pre-Brownian process on a Gaussian
        Banach space. The theorem operates on the natural (generated)
        filtration, not an arbitrary one as in the textbook.

acknowledgements: "Mathlib contributors; leanprover/comparator maintainers"
